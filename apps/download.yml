version: '3.7'
services:
  # Feature-rich BitTorrent client
  # https://github.com/qbittorrent/qBittorrent/wiki
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - WEBUI_PORT=80
      - TORRENTING_PORT=55555
    volumes:
      - @config
      - @media
      - /mnt/scratch/downloads:/downloads
    ports:
      - 55555:55555
      - 55555:55555/udp
    deploy:
      resources:
        limits:
          memory: 16G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 10s
    x-features:
      - domain: torrents
      - homepage:
          group: Download
          description: Torrent client
          name: qBittorrent
          weight: 10
      - widget:
          enableLeechProgress: true


  # Torrent management and automation tool
  # https://github.com/StuffAnThings/qbit_manage
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:latest
    volumes:
      - @config
      - @media
      - /mnt/nvme/apps/qbittorrent/config/qBittorrent:/qbittorrent/:ro
    environment:
      # Web API Configuration
      - QBT_WEB_SERVER=true     # Set to true to enable web API and web UI
      - QBT_PORT=80           # Web API port (default: 8080)

      # Scheduler Configuration
      - QBT_RUN=false
      - QBT_SCHEDULE=1440
      - QBT_CONFIG_DIR=/config
      - QBT_LOGFILE=qbit_manage.log

      # Command Flags
      - QBT_RECHECK=false
      - QBT_CAT_UPDATE=false
      - QBT_TAG_UPDATE=false
      - QBT_REM_UNREGISTERED=false
      - QBT_REM_ORPHANED=false
      - QBT_TAG_TRACKER_ERROR=false
      - QBT_TAG_NOHARDLINKS=false
      - QBT_SHARE_LIMITS=false
      - QBT_SKIP_CLEANUP=false
      - QBT_DRY_RUN=false
      - QBT_STARTUP_DELAY=0
      - QBT_SKIP_QB_VERSION_CHECK=false
      - QBT_DEBUG=false
      - QBT_TRACE=false

      # Logging Configuration
      - QBT_LOG_LEVEL=INFO
      - QBT_LOG_SIZE=10
      - QBT_LOG_COUNT=5
      - QBT_DIVIDER==
      - QBT_WIDTH=100
    x-features:
      - domain: qbit-manage
      - homepage:
          group: Download
          description: Advanced torrent management
          name: qBit Manage
          weight: 20
          icon: https://raw.githubusercontent.com/StuffAnThings/qbit_manage/refs/heads/master/icons/qbm_logo.png

  # Failed and stalled download handling
  # https://github.com/ManiMatter/decluttarr
  decluttarr:
    image: ghcr.io/dalbothek/decluttarr:instance-job-config
    volumes:
      - @config:/app/config
      - @logs:/app/logs
      - @media
    depends_on:
      qbittorrent:
        condition: service_healthy

  # Automatic archive extraction
  # https://github.com/Unpackerr/unpackerr
  unpackerr:
    image: golift/unpackerr:latest
    user: 1000:1000
    environment:
      - UN_LOG_FILE=/log/unpackerr.log
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=$SONARR_API_KEY
      - UN_SONARR_0_PATHS_0=/media/downloads
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=$RADARR_API_KEY
      - UN_RADARR_0_PATHS_0=/media/downloads
      - UN_WEBSERVER_METRICS=true
    volumes:
      - @log
      - @media
    x-features:
      - homepage:
           group: Download
           description: Archive extraction
           href: https://docker.dalboplex.ch/show?name=unpackerr
           weight: 50
           icon: https://unpackerr.zip/img/icon.png
#      - widget-prometheus:
#          metrics:
#            - label: Files extracted
#              query: sum(unpackerr_files_extracted_total)
#            - label: Bytes extracted
#              query: sum(unpackerr_bytes_written_total)
#              format:
#                type: bytes

  # Cross-seeding automation for torrent trackers
  # https://www.cross-seed.org/
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6
    user: 1000:1000
    volumes:
      - @config
      - @media
    command: daemon
    depends_on:
      qbittorrent:
        condition: service_healthy


  # Automatic torrent downloader
  # https://autobrr.com/
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    user: 1000:1000
    volumes:
      - @config
    x-features:
      - domain:
          subdomain: autobrr
          port: 7474
      - homepage:
          group: Download
          description: Torrent announcement handling
          weight: 60
      - widget:
          key: $AUTOBRR_API_KEY


  # Usenet binary downloader
  # https://sabnzbd.org/
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    volumes:
      - @config
      - @media
      - /mnt/scratch/downloads:/downloads
    x-features:
      - domain:
          subdomain: usenet
          port: 8080
      - homepage:
          group: Download
          description: Usenet download client
          weight: 40
      - widget:
          key: $SABNZBD_API_KEY
