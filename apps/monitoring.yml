version: '3.7'
x-icon: grafana
services:
  # Metrics visualization and dashboarding
  # https://grafana.com/
  grafana:
    image: grafana/grafana:latest
    user: 1000:1000
    volumes:
      - @data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.dalboplex.ch
      - GF_SECURITY_ADMIN_USER=simon@ceilingcat.ch
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-Auth-Request-Email
      - GF_AUTH_PROXY_HEADER_PROPERTY=email
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_HEADERS=Email:X-Auth-Request-Email
    x-features:
      - domain:
          subdomain: grafana
          port: 3000
      - homepage:
          group: Monitoring
          description: Metrics visualization
          weight: 20
      - metrics:

  # Long-term storage for Prometheus metrics
  # https://victoriametrics.com/
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    user: 1000:1000
    command:
      - --storageDataPath=/storage
      - --httpListenAddr=:8428
      - --retentionPeriod=10y
    volumes:
      - @data:/storage
    x-features:
      - domain:
          subdomain: victoria
          port: 8428
      - homepage:
          group: Monitoring
          description: Long-term metrics storage
          weight: 55
      - metrics:

  # Metrics collection and time-series database
  # https://prometheus.io/
  prometheus:
    image: prom/prometheus:v3.7.3
    user: 1000:1000
    command:
      - --config.file=/config/prometheus.yml
      - --storage.tsdb.path=/data
      - --storage.tsdb.retention.time=90d
      - --query.lookback-delta=15m
      - --web.external-url=https://prometheus.dalboplex.ch
    volumes:
      - @data
      - @config
    x-features:
      - domain:
          subdomain: prometheus
          port: 9090
      - homepage:
          group: Monitoring
          description: Metrics aggregation
          weight: 50
      - widget:
      - metrics:

  # Prometheus node exporter for system metrics
  # https://github.com/prometheus/node_exporter
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    command:
      - '--path.rootfs=/host'
      - '--collector.processes'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    devices:
      - /dev/dri
      - /dev/sda
      - /dev/sdb
      - /dev/sdc
      - /dev/sdd
      - /dev/sde
      - /dev/sdf
      - /dev/sdg
      - /dev/sdh
      - /dev/sdi
      - /dev/sdj
      - /dev/nvme0
      - /dev/nvme1
      - /dev/nvme2
      - /dev/nvme3
    x-features:
      - metrics:
          port: 9100


  # Hard drive and SSD monitoring
  # https://github.com/AnalogJ/scrutiny
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    environment:
      - COLLECTOR_CRON_SCHEDULE=17 1 * * *
    volumes:
      - @config:/opt/scrutiny/config
      - @data:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/sdc
      - /dev/sdd
      - /dev/sde
      - /dev/sdf
      - /dev/sdg
      - /dev/sdh
      - /dev/sdi
      - /dev/sdj
      - /dev/nvme0
      - /dev/nvme1
      - /dev/nvme2
      - /dev/nvme3
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    x-features:
      - domain:
          subdomain: scrutiny
          port: 8080
      - homepage:
          group: Monitoring
          description: Disk health monitoring
          weight: 30
      - widget:

  # Service uptime monitoring with status pages and alerts
  # https://github.com/louislam/uptime-kuma
  uptime-kuma:
    image: louislam/uptime-kuma:2-rootless
    volumes:
      - @data:/app/data
    user: 1000:1000
    x-features:
      - domain:
          subdomain: uptime
          port: 3001
      - homepage:
          name: Uptime Kuma
          group: Monitoring
          description: Service availability
          weight: 10
      - widget:
          type: uptimekuma
          slug: all
      - metrics:

  # Automatic Uptime Kuma monitor creation from Docker labels
  # https://github.com/BigBoot/AutoKuma
  autokuma:
    image: ghcr.io/bigboot/autokuma:latest
    user: 1000:1000
    volumes:
      - @data
    environment:
      - AUTOKUMA__KUMA__URL=http://uptime-kuma:3001
      - AUTOKUMA__DOCKER__HOSTS=http://dockerproxy:2375
      - AUTOKUMA__ON_DELETE=keep
    labels:
      - kuma.docker.docker_host.name=Docker
      - kuma.docker.docker_host.connection_type=tcp
      - kuma.docker.docker_host.host=http://dockerproxy:2375
      - kuma.discord.notification.name=Discord
      - kuma.discord.notification.active=true
      - 'kuma.discord.notification.config={"type": "discord", "discordWebhookUrl": "$UPTIME_KUMA_NOTIFICATION_URL"}'

  # Cross-platform system monitoring with web interface
  # https://nicolargo.github.io/glances/
  glances:
    image: nicolargo/glances:latest
    pid: host
    environment:
      - GLANCES_OPT=-w
      - DOCKER_HOST=tcp://dockerproxy:2375
    volumes:
      - @config:/etc/glances
      - /etc/os-release:/etc/os-release:ro
    devices:
      - /dev/dri
    x-features:
      - domain:
          subdomain: glances
          port: 61208
      - homepage:
          group: System
          description: Resource usage
          weight: 35
      - widget:
          version: 4
          metric: cpu
      - uptime:
          monitor: docker

  # Internet connection monitoring and testing
  # https://docs.speedtest-tracker.dev/
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    environment:
      - APP_KEY=$SPEEDTEST_APP_KEY
      - DB_CONNECTION=sqlite
      - APP_URL=https://speedtest.dalboplex.ch
      - ASSET_URL=https://speedtest.dalboplex.ch
      - DISPLAY_TIMEZONE=Europe/Zurich
      - SPEEDTEST_SCHEDULE=33 */2 * * *
      - SPEEDTEST_SERVERS=3188,50092,54457
      - PUBLIC_DASHBOARD=true
    volumes:
      - @config
    x-features:
      - domain: speedtest
      - homepage:
          group: Monitoring
          description: Internet speed monitoring
          icon: speedtest-tracker
          weight: 40
      - widget:
          version: 2
          key: $SPEEDTEST_API_KEY


  # Prometheus metrics exporter for digitec hard drive prices
  # https://github.com/heapoutofspace/savarr
  savarr:
    image: ghcr.io/heapoutofspace/savarr:latest
    user: 1000:1000
    volumes:
      - @config
    x-features:
      - metrics:
          port: 8000
          scrape_interval: 10m
