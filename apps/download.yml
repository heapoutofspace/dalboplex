version: '3.7'
x-icon: qbittorrent
services:
  # Feature-rich BitTorrent client
  # https://github.com/qbittorrent/qBittorrent/wiki
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    environment:
      - WEBUI_PORT=80
      - TORRENTING_PORT=55555
    volumes:
      - @config
      - @media
      - /mnt/scratch/downloads:/downloads
    ports:
      - 55555:55555
      - 55555:55555/udp
    deploy:
      resources:
        limits:
          memory: 16G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 10s
    x-features:
      - domain: torrents
      - homepage:
          group: Download
          description: Torrent client
          name: qBittorrent
          weight: 10
      - widget:
          enableLeechProgress: true


  # Usenet binary downloader
  # https://sabnzbd.org/
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    volumes:
      - @config
      - @media
      - /mnt/scratch/downloads:/downloads
    x-features:
      - domain:
          subdomain: usenet
          port: 8080
      - homepage:
          group: Download
          description: Usenet download client
          weight: 40
      - widget:
          key: $SABNZBD_API_KEY
